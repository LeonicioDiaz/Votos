<!DOCTYPE html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Feria Talento Emprendedor - Votación</title>

    <!-- Tailwind CSS -->
    <script src="tailwind.js"></script>
    <!-- Lógica de aplicación original -->
    <script type="module" src="app.js"></script>
    <!-- Hoja de estilos personalizados -->
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body class="bg-gray-950 text-gray-100 min-h-screen flex flex-col justify-between relative selection:bg-cyan-500 selection:text-black">

    <!-- Sistema de Audio -->
    <audio id="voteSound" src="sounds/success.mp3" preload="auto"></audio>

    <!-- Fondo dinámico tecnológico -->
    <div class="network-bg fixed inset-0 pointer-events-none z-0"></div>

    <!-- Contenido principal -->
    <main class="container mx-auto px-4 py-8 relative z-10 flex-grow flex flex-col items-center justify-start max-w-5xl fade-in">
      
      <!-- Encabezado y Marca -->
      <header class="w-full flex flex-col items-center justify-center mb-10 text-center">
        <div class="relative group cursor-pointer">
          <div class="absolute -inset-1 bg-gradient-to-r from-cyan-500 via-blue-600 to-purple-600 rounded-2xl blur-lg opacity-40 group-hover:opacity-75 transition duration-500"></div>
          <img
            id="logo"
            src="./img/logo-feria.png"
            alt="Logo Feria Talento Emprendedor"
            class="relative w-72 md:w-80 h-auto object-contain logo-glow drop-shadow-2xl"
          />
        </div>
        <p class="mt-4 text-xs md:text-sm font-semibold tracking-widest text-cyan-400 uppercase">
          Plataforma Oficial de Evaluación & Votación
        </p>
      </header>

      <!-- Contenedor dinámico de categorías y proyectos -->
      <section
        id="categories"
        class="w-full space-y-8 glass-container mt-2 text-center border border-slate-800/80 rounded-2xl p-6 md:p-10 shadow-2xl backdrop-blur-xl bg-slate-900/60"
      >
        <!-- El contenido se inyecta mediante JS dinámicamente -->
      </section>

      <!-- Acción principal de confirmación -->
      <div class="w-full flex justify-center mt-12 mb-6">
        <button
          id="confirm-votes"
          class="btn-neon relative inline-flex items-center justify-center px-8 py-4 font-bold text-white uppercase tracking-wider rounded-full shadow-2xl transition-all duration-300 disabled:opacity-40 disabled:cursor-not-allowed disabled:transform-none disabled:shadow-none"
          disabled
        >
          <span class="relative z-10 flex items-center gap-2 text-base md:text-lg">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
            Enviar Votos
          </span>
        </button>
      </div>

    </main>

    <!-- Controles flotantes periféricos (Admin & Pantalla Completa) -->
    <aside id="admin-container" class="fixed bottom-6 left-6 z-50">
      <button
        id="admin-btn"
        class="w-12 h-12 rounded-full bg-slate-900/80 hover:bg-cyan-600 text-cyan-400 hover:text-white border border-slate-700/60 hover:border-cyan-400 shadow-lg backdrop-blur-md transition-all duration-300 flex items-center justify-center group transform hover:scale-110"
        title="Administración"
      >
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5 transition-transform group-hover:rotate-12">
          <path stroke-linecap="round" stroke-linejoin="round" d="M8 21h8m-8 0a3 3 0 0 0 8 0m-8 0h8M6 3v3a6 6 0 0 0 12 0V3M4 7h2m12 0h2m-2 0a6 6 0 0 1-12 0" />
        </svg>
      </button>
    </aside>

    <aside id="fullscreen-container" class="fixed top-6 right-6 z-50">
      <button
        id="fullscreen-btn"
        class="w-12 h-12 rounded-full bg-slate-900/80 hover:bg-cyan-600 text-cyan-400 hover:text-white border border-slate-700/60 hover:border-cyan-400 shadow-lg backdrop-blur-md transition-all duration-300 flex items-center justify-center transform hover:scale-110"
        title="Pantalla completa"
      >
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M8 3H5a2 2 0 00-2 2v3m0 8v3a2 2 0 002 2h3m8-16h3a2 2 0 012 2v3m0 8v3a2 2 0 01-2 2h-3" />
        </svg>
      </button>
    </aside>

    <!-- Modal: Verificación por Código -->
    <div
      id="code-modal"
      class="fixed inset-0 bg-slate-950/80 backdrop-blur-md hidden justify-center items-center z-[10000] p-4 fade-in"
    >
      <div class="glass-modal max-w-md w-full border border-cyan-500/30 rounded-2xl p-6 md:p-8 text-center bg-slate-900/90 shadow-2xl relative overflow-hidden">
        <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-cyan-500 via-blue-500 to-purple-500"></div>
        <h3 class="text-2xl font-bold mb-2 text-white tracking-wide">Código de Votación</h3>
        <p class="text-slate-400 text-sm mb-6">Ingresa el código proporcionado para validar la autenticidad de tu voto.</p>

        <div class="relative mb-4">
          <input
            id="voter-code"
            type="text"
            maxlength="20"
            autocomplete="off"
            autocapitalize="characters"
            placeholder="EJ. A7K9P2"
            class="w-full rounded-xl bg-slate-950/80 border border-slate-700 focus:border-cyan-400 text-cyan-300 text-center text-2xl font-mono tracking-widest px-4 py-3 uppercase outline-none transition-all shadow-inner"
          />
        </div>

        <p id="code-error" class="hidden text-red-400 text-xs font-semibold mb-4 bg-red-950/40 border border-red-500/20 py-2 rounded-lg"></p>

        <div class="flex justify-center gap-4 mt-6">
          <button
            id="cancel-code"
            type="button"
            class="px-5 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-sm font-semibold transition-all duration-200 border border-slate-700"
          >
            Cancelar
          </button>
          <button
            id="submit-code"
            type="button"
            class="btn-neon px-6 py-2.5 text-sm font-bold tracking-wider text-white uppercase rounded-xl"
          >
            Confirmar Voto
          </button>
        </div>
      </div>
    </div>

    <!-- Modal: Éxito -->
    <div
      id="success-modal"
      class="fixed inset-0 bg-slate-950/85 backdrop-blur-lg flex justify-center items-center hidden z-[10001] p-4"
    >
      <div class="glass-modal text-center max-w-sm w-full mx-auto p-6 border border-cyan-400/30 rounded-2xl bg-slate-900/90 shadow-2xl transform scale-95 transition-all relative overflow-hidden">
        <div class="absolute inset-0 bg-gradient-to-b from-cyan-500/10 to-transparent pointer-events-none"></div>
        <h3 class="text-2xl font-extrabold mb-4 bg-gradient-to-r from-cyan-400 to-blue-500 bg-clip-text text-transparent">
          ¡Voto Registrado!
        </h3>
        <div class="relative mb-4 overflow-hidden rounded-xl border border-slate-700/60 shadow-lg">
          <img
            src="./img/imagenocelote.png"
            alt="Imagen de éxito"
            class="w-full h-auto object-cover transform hover:scale-105 transition-transform duration-500"
          />
        </div>
        <p class="text-xs text-slate-400 font-medium">Muchas gracias por participar en la evaluación del talento emprendedor.</p>
      </div>
    </div>

  </body>
</html>
